<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .l { fill: none; stroke: #efe4cd; stroke-width: .8; stroke-linecap: round; }

  /* the whole web comes and goes, as if it only shows when the light finds it */
  .all { animation: env 14s ease-in-out infinite; }

  /* while it is visible the threads shimmer, each on its own beat, so the
     glimmer seems to travel across the web instead of pulsing all at once */
  .rad  { animation: fl 3.7s ease-in-out infinite; animation-delay: -.9s; }
  .r0   { animation: fl 3.1s ease-in-out infinite; animation-delay: -.2s; }
  .r1   { animation: fl 3.4s ease-in-out infinite; animation-delay: -1.1s; }
  .r2   { animation: fl 2.9s ease-in-out infinite; animation-delay: -2.0s; }
  .r3   { animation: fl 3.8s ease-in-out infinite; animation-delay: -.6s; }
  .r4   { animation: fl 3.3s ease-in-out infinite; animation-delay: -1.7s; }

  .dew  { fill: #fff4d8; transform-box: fill-box; transform-origin: center;
           animation: tw 2.8s ease-in-out infinite; opacity: 0; }
  .d1 { animation-delay: -.5s; animation-duration: 3.3s; }
  .d2 { animation-delay: -1.4s; animation-duration: 2.4s; }
  .d3 { animation-delay: -2.1s; animation-duration: 3.9s; }
  .d4 { animation-delay: -.9s; animation-duration: 2.7s; }
  .d5 { animation-delay: -1.8s; animation-duration: 3.6s; }
  .d6 { animation-delay: -2.6s; animation-duration: 3.0s; }

  @keyframes env {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    34%  { opacity: .85; }
    48%  { opacity: 1; }
    62%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes fl {
    0%, 100% { opacity: .42; }
    18% { opacity: .95; }
    34% { opacity: .32; }
    58% { opacity: 1; }
    76% { opacity: .5; }
  }
  @keyframes tw {
    0%, 100% { opacity: 0; transform: scale(.4); }
    45% { opacity: .95; transform: scale(1); }
    60% { opacity: .15; transform: scale(.6); }
  }

  /* for visitors who prefer less motion: a calm, still web */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .all { opacity: .45; }
    .dew { opacity: .6; }
  }
</style>
<g class="all">
