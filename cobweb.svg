  <circle class="dew d0" cx="78.47" cy="29.25" r="1.15"/><circle class="dew d1" cx="51.03" cy="16.59" r="1.15"/><circle class="dew d2" cx="83.41" cy="48.97" r="1.15"/><circle class="dew d3" cx="45.64" cy="39.77" r="1.15"/><circle class="dew d4" cx="78.62" cy="63.73" r="1.15"/><circle class="dew d5" cx="51.11" cy="66.92" r="1.15"/><circle class="dew d6" cx="21.51" cy="26.18" r="1.15"/>
</g>
